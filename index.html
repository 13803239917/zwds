function calcZiweiDz(day, ju) {
  var shang = Math.floor(day / ju);
  var yu = day % ju;
  var pos;
  if (yu === 0) pos = shang - 1;
  else {
    var jie = ju - yu;
    if (jie % 2 === 0) pos = shang + jie;
    else pos = shang - jie;
  }
  return DIZHI[((2 + pos) % 12 + 12) % 12];
}

      gongGan[DIZHI[gzIdx]] = TIANGAN[gtgIdx];
    }
    var maQianShen = ["驿马","六害","华盖","劫杀","灾杀","天杀","地杀","年杀","月杀","亡神","将星","攀鞍"];
    maQianText = {};
    if (group) {
      var tianMaDz = HUOXING_LINGXING_MAP[group]["天马"];
      var tmIdx = DIZHI.indexOf(tianMaDz);
      for (var i=0; i<maQianShen.length; i++) {
        var dz2 = DIZHI[(tmIdx+i)%12];
        if (!maQianText[dz2]) maQianText[dz2] = [];
        maQianText[dz2].push(maQianShen[i]);
      }
    }
    juUsed = ju; juNameUsed = juName;
  }

  PAN_DATA = {
    yearGZ:yearGZ, monthGZ:monthGZ, dayGZ:dayGZ, hourGZ:hourGZ,
    yearTg:yearTg, yearDz:yearDz, hourDz:hourDz, hourIdx:hourIdx,
    hourWuxing:hourWuxing, ju:juUsed, juName:juNameUsed,
    mingGong:mingGong, shenGong:shenGong,
    taijiGong:taijiGong, tiankuGong:tiankuGong,
    palaces:palaces, sihua:sihua, waiJuText:waiJuText,
    daXianText:daXianText, daXianData:daXianData,
    xiaoXianText:xiaoXianText, csText:csText,
    gongGan:gongGan, maQianText:maQianText,
    gender:gender, lunarMonth:lunarMonth, lunarDay:lunarDay,
    daXianShun:daXianShun, birthYear:birthYear,
    inputYear:inputYear, inputMonth:inputMonth, inputDay:inputDay,
    inputHour:inputHour, inputMinute:inputMinute,
    calendarType:calendarType, panType:PAN_TYPE
  };
  CURRENT_FEIHUA_GONG = null; CURRENT_DAXIAN_INDEX = 0; CURRENT_LIUNIAN_AGE = null;
  renderPan();
}

function paipanZiwei(lunarMonth, lunarDay, hourIdx, yearGan, yearZhi, juFallback) {
  var palaces = {};
  for (var i=0; i<12; i++) palaces[DIZHI[i]] = [];
  var mingIdx = ((2 + lunarMonth - 1) - hourIdx + 120) % 12;
  var mingGong = DIZHI[mingIdx];
  var shenIdx = (2 + lunarMonth - 1 + hourIdx) % 12;
  var shenGong = DIZHI[shenIdx];
  var yinGan = getYinGan(yearGan);
  var yinGanIdx = TIANGAN.indexOf(yinGan);
  var gongGan = {};
  for (var gi=0; gi<12; gi++) gongGan[DIZHI[(2+gi)%12]] = TIANGAN[(yinGanIdx+gi)%10];
  var mingGZ = gongGan[mingGong] + mingGong;
  var mingWuxing = getWuxing(mingGZ);
  var ju = WUXING_JU[mingWuxing] || juFallback;
  var ziweiDz = calcZiweiDz(lunarDay, ju);
  var ziweiIdx = DIZHI.indexOf(ziweiDz);
  var tianfuIdx = (4 - ziweiIdx + 120) % 12;
  var tianfuDz = DIZHI[tianfuIdx];
  for (var i=0; i<ZIWEI_SERIES.length; i++) {
    palaces[DIZHI[(ziweiIdx + ZIWEI_OFFSETS[i] + 120) % 12]].push(ZIWEI_SERIES[i]);
  }
  for (var i=0; i<TIANFU_SERIES.length; i++) {
    palaces[DIZHI[(tianfuIdx + TIANFU_OFFSETS[i] + 120) % 12]].push(TIANFU_SERIES[i]);
  }
  palaces[DIZHI[(4 + lunarMonth - 1) % 12]].push("左辅");
  palaces[DIZHI[(10 - lunarMonth + 1 + 120) % 12]].push("右弼");
  palaces[DIZHI[(10 - hourIdx + 120) % 12]].push("文昌");
  palaces[DIZHI[(4 + hourIdx) % 12]].push("文曲");
  var kuiYue = KUAYUE_MAP[yearGan];
  if (kuiYue) {
    palaces[kuiYue[0]].push("天魁");
    palaces[kuiYue[1]].push("天钺");
  }
  var luDz = LUCUN_MAP[yearGan];
  if (luDz) {
    palaces[luDz].push("禄存");
    var luI = DIZHI.indexOf(luDz);
    palaces[DIZHI[(luI+1)%12]].push("擎羊");
    palaces[DIZHI[(luI-1+12)%12]].push("陀罗");
  }
  var group = getSanheGroup(yearZhi);
  if (group) {
    palaces[DIZHI[(DIZHI.indexOf(ZW_HUO[group]) + hourIdx) % 12]].push("火星");
    palaces[DIZHI[(DIZHI.indexOf(ZW_LING[group]) + hourIdx) % 12]].push("铃星");
    palaces[ZW_MA[group]].push("天马");
  }
  palaces[DIZHI[(DIZHI.indexOf("酉") + lunarMonth - 1) % 12]].push("天刑");
  palaces[DIZHI[(DIZHI.indexOf("丑") + lunarMonth - 1) % 12]].push("天姚");
  var yearZhiIdx = DIZHI.indexOf(yearZhi);
  var hongLuanIdx = (DIZHI.indexOf("卯") - yearZhiIdx + 120) % 12;
  palaces[DIZHI[hongLuanIdx]].push("红鸾");
  palaces[DIZHI[(hongLuanIdx + 6) % 12]].push("天喜");
  return {
    palaces: palaces,
    mingGong: mingGong, shenGong: shenGong, ju: ju,
    sihua: ZIWEI_SIHUA[yearGan] || {},
    gongGan: gongGan,
    ziweiGong: ziweiDz, tianfuGong: tianfuDz
  };
}

function getLaiYinGong() {
  var d = PAN_DATA; if (!d) return null;
  var yearTg = d.yearTg;
  var candidates = ["寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  for (var i=0; i<candidates.length; i++) if (d.gongGan[candidates[i]] === yearTg) return candidates[i];
  return null;
}
function getLiuNianGong(age) {
  var d = PAN_DATA; if (!d) return null;
  var birthIdx = DIZHI.indexOf(d.yearDz);
  return DIZHI[(birthIdx + age - 1) % 12];
}
function getXiaoXianGong(age) {
  var d = PAN_DATA; if (!d) return null;
  var group = getSanheGroup(d.yearDz);
  var startDz;
  if (group==="寅午戌") startDz="辰";
  else if (group==="申子辰") startDz="戌";
  else if (group==="巳酉丑") startDz="未";
  else if (group==="亥卯未") startDz="丑";
  else return null;
  var startIdx = DIZHI.indexOf(startDz);
  var xxShun = !d.daXianShun;
  var step = age - 1;
  if (xxShun) return DIZHI[(startIdx + step) % 12];
  return DIZHI[(startIdx - step + 1200) % 12];
}
function getDaXianYears() {
  var d = PAN_DATA; if (!d) return {};
  var result = {};
  var curDx = d.daXianData[CURRENT_DAXIAN_INDEX];
  for (var age=curDx.start; age<=curDx.end; age++) {
    result[getLiuNianGong(age)] = {age:age, year:d.birthYear + age - 1};
  }
  return result;
}
function getFeihuaColors() {
  var result = {};
  if (!CURRENT_FEIHUA_GONG || !PAN_DATA) return result;
  var gGan = PAN_DATA.gongGan[CURRENT_FEIHUA_GONG];
  if (!gGan) return result;
  var sh = getActiveGongSihuaTable()[gGan];
  if (!sh) return result;
  for (var type in sh) {
    var stars = toArr(sh[type]);
    var cls = "feihua-" + SIHUA_CLS[type];
    for (var i=0; i<stars.length; i++) {
      var star = stars[i];
      if (result[star]) {
        if (SIHUA_PRIORITY[cls] > SIHUA_PRIORITY[result[star]]) result[star] = cls;
      } else result[star] = cls;
    }
  }
  return result;
}
function getZiHuaMap() {
  var result = {};
  if (!PAN_DATA) return result;
  var table = getActiveGongSihuaTable();
  for (var i=0; i<DIZHI.length; i++) {
    var dz = DIZHI[i];
    var gGan = PAN_DATA.gongGan[dz];
    if (!gGan) continue;
    var sh = table[gGan];
    if (!sh) continue;
    var palaceStars = PAN_DATA.palaces[dz];
    for (var type in sh) {
      var stars = toArr(sh[type]);
      for (var si=0; si<stars.length; si++) {
        if (palaceStars.indexOf(stars[si]) >= 0) {
          if (!result[dz]) result[dz] = {};
          if (!result[dz][stars[si]]) result[dz][stars[si]] = [];
          result[dz][stars[si]].push(type);
        }
      }
    }
  }
  return result;
}

function renderPan() {
  var d = PAN_DATA; if (!d) return;
  var feihuaColors = getFeihuaColors();
  var daXianYears = getDaXianYears();
  var laiYinGong = getLaiYinGong();

  var mingIdx = DIZHI.indexOf(d.mingGong);
  var currentPalaceName = {};
  for (var i=0; i<12; i++) currentPalaceName[DIZHI[(mingIdx-i+120)%12]] = GONG_NAMES[i];

  var daXianGong = d.daXianData[CURRENT_DAXIAN_INDEX].dz;
  var daXianIdx2 = DIZHI.indexOf(daXianGong);
  var daXianNameMap = {};
  for (var i=0; i<12; i++) daXianNameMap[DIZHI[(daXianIdx2-i+120)%12]] = "大" + GONG_SHORT_DA[i];

  var liuNianNameMap = {};
  if (CURRENT_LIUNIAN_AGE !== null) {
    var lnMingDz = getLiuNianGong(CURRENT_LIUNIAN_AGE);
    var lnMingIdx = DIZHI.indexOf(lnMingDz);
    for (var i=0; i<12; i++) liuNianNameMap[DIZHI[(lnMingIdx-i+120)%12]] = GONG_NAMES_LN[i];
  }
  var xiaoXianNameMap = {};
  if (CURRENT_LIUNIAN_AGE !== null) {
    var xxMingDz = getXiaoXianGong(CURRENT_LIUNIAN_AGE);
    if (xxMingDz) {
      var xxMingIdx = DIZHI.indexOf(xxMingDz);
      for (var i=0; i<12; i++) xiaoXianNameMap[DIZHI[(xxMingIdx-i+120)%12]] = GONG_NAMES_XX[i];
    }
  }

  var gridPos = {"巳":[0,0],"午":[0,1],"未":[0,2],"申":[0,3],"辰":[1,0],"酉":[1,3],"卯":[2,0],"戌":[2,3],"寅":[3,0],"丑":[3,1],"子":[3,2],"亥":[3,3]};

  var cellContents = {};
  for (var dd=0; dd<DIZHI.length; dd++) {
    var dz = DIZHI[dd];
    var rawStars = d.palaces[dz];
    var starHtml = "";
    for (var si=0; si<rawStars.length; si++) {
      var s = rawStars[si];
      var display = isZiwei() ? s : (NAME_MAP[s] || s);
      var cls = KEY_STARS.indexOf(s) >= 0 ? "star-key" : "star-name";
      var extraCls = feihuaColors[s] ? " " + feihuaColors[s] : "";
      var shArr = toArr(d.sihua[s]);
      var sihuaMark = '';
      for (var hi=0; hi<shArr.length; hi++) {
        var t = shArr[hi];
        var label = getSihuaLabelWithContext(d.yearTg, s, t);
        sihuaMark += '<span class="sihua sihua-' + SIHUA_CLS[t] + '">' + label + '</span>';
      }
      var mw = getMiaoWang(s, dz);
      var mwMark = mw ? '<span class="' + getMiaoWangClass(mw) + '">' + mw + '</span>' : '';
      starHtml += '<span class="star-group" data-star="' + s + '"><span class="' + cls + extraCls + '">' + display + '</span>' + mwMark + sihuaMark + '</span>';
    }
    var infoStarsHtml = '';
    if (d.waiJuText && d.waiJuText[dz]) infoStarsHtml += '<span class="v-star waiju">' + d.waiJuText[dz] + '</span>';
    if (d.maQianText && d.maQianText[dz]) {
      for (var mi=0; mi<d.maQianText[dz].length; mi++) {
        infoStarsHtml += '<span class="v-star maqian">' + d.maQianText[dz][mi] + '</span>';
      }
    }
    var gongName = currentPalaceName[dz] || "";
    var csTextDz = d.csText[dz] || "";
    var tgTextDz = d.gongGan[dz] || "";
    var daXianName = daXianNameMap[dz] || "";
    var daXianAge = d.daXianText[dz] || "";
    var shenMark = (dz===d.shenGong) ? "身宫" : "";
    var laiYinMark = (dz===laiYinGong) ? "来因" : "";

    var zihuaTagRowHtml = renderZihuaTags(dz);
    var zihuaTagRowTop = '';
    var zihuaTagRowBottom = '';
    if (zihuaTagRowHtml) {
      if (GROUP_TOP.indexOf(dz) >= 0) zihuaTagRowTop = zihuaTagRowHtml;
      else zihuaTagRowBottom = zihuaTagRowHtml;
    }

    var labelHtml = '';
    if (CURRENT_LIUNIAN_AGE !== null) {
      var xxLabel = xiaoXianNameMap[dz] || "";
      var nmLabel = liuNianNameMap[dz] || "";
      labelHtml = '<div class="liunian-label">' +
                    (xxLabel ? '<div class="xx-line">' + xxLabel + '</div>' : '') +
                    (nmLabel ? '<div class="nm-line">' + nmLabel + '</div>' : '') + '</div>';
    } else {
      var dxLabel = daXianYears[dz] ? (daXianYears[dz].age + "岁 " + daXianYears[dz].year + "年") : "";
      labelHtml = '<div class="liunian-label">' +
                    (dxLabel ? '<div class="nm-line">' + dxLabel + '</div>' : '') + '</div>';
    }
    var rightLabels = '<div class="right-labels">' +
                        (shenMark ? '<div class="sheng-line">' + shenMark + '</div>' : '') +
                        (laiYinMark ? '<div class="laiyin-line">' + laiYinMark + '</div>' : '') + '</div>';

    var topLineRow = '<div class="top-line-row">' +
                       '<div class="changsheng-line">' + csTextDz + '</div>' +
                       labelHtml + rightLabels + '</div>';

    var bottomBar = zihuaTagRowBottom + topLineRow +
                    '<div class="bottom-bar">' +
                     '<div class="left-stack"><div class="tiangan">' + tgTextDz + '</div><div class="dizhi">' + dz + '</div></div>' +
                     '<div class="center-info">' +
                       '<div class="center-top"><div class="daxian-name">' + daXianName + '</div></div>' +
                       '<div class="center-divider"></div>' +
                       '<div class="age-range">' + daXianAge + '</div>' +
                     '</div>' +
                     '<div class="right-vertical"><div class="gong-name-vertical">' + gongName + '</div></div>' +
                     '</div>';
                     
    // ================= 自动缩小逻辑 =================
    // 计算当前宫位的星星总数（主星 + 外局星 + 马前星）
    var extCount = (d.waiJuText && d.waiJuText[dz] ? 1 : 0) + (d.maQianText && d.maQianText[dz] ? d.maQianText[dz].length : 0);
    var starCount = rawStars.length + extCount;
    
    // 如果是手机版，且星星总数 > 5，就加上 shrink-stars 类
    var shrinkCls = (VIEW_MODE === "mobile" && starCount > 5) ? " shrink-stars" : "";
    // ===============================================

    cellContents[dz] = zihuaTagRowTop + '<div class="stars' + shrinkCls + '">' + starHtml + infoStarsHtml + '</div>' + bottomBar;
  }

  var sihuaLines = [];
  for (var st in d.sihua) {
    var shArr2 = toArr(d.sihua[st]);
    if (shArr2.length === 0) continue;
    var nm = isZiwei() ? st : (NAME_MAP[st] || st);
    var labels = [];
    for (var li=0; li<shArr2.length; li++) {
      labels.push(getSihuaLabelWithContext(d.yearTg, st, shArr2[li]));
    }
    sihuaLines.push(nm + "化" + labels.join("、"));
  }
  var hourStr = (d.inputHour<10?'0':'') + d.inputHour + ':' + (d.inputMinute<10?'0':'') + d.inputMinute;

  var panName = isZiwei() ? "紫微斗数" : (isSix() ? "中天六化" : "中天太极");
  var centerHtml = '<h2>命主信息（' + panName + '）</h2>' +
                   '<p><b>四柱：</b>' + d.yearGZ + ' ' + d.monthGZ + ' ' + d.dayGZ + ' ' + d.hourGZ + '</p>' +
                   '<p><b>出生：</b>' + d.inputYear + '年' + d.inputMonth + '月' + d.inputDay + '日 ' + hourStr + '（' + (d.calendarType==='solar'?'公历':'农历') + '）</p>' +
                   '<p><b>农历：</b>' + d.lunarMonth + '月' + d.lunarDay + '日</p>' +
                   '<p><b>生时纳音：</b>' + (NAYIN[d.hourGZ]||"") + '（' + d.hourWuxing + '）</p>' +
                   '<p><b>五行局：</b>' + d.juName + '</p>' +
                   '<p><b>命宫：</b>' + d.mingGong + '　<b>身宫：</b>' + d.shenGong + '　<b>来因：</b>' + (laiYinGong||"") + '</p>' +
                   '<p><b>紫微：</b>' + d.taijiGong + '　<b>天府：</b>' + d.tiankuGong + '</p>' +
                   '<p><b>' + (isSix() ? "生年六化" : "生年四化") + '：</b>' + sihuaLines.join('　') + '</p>';

  var html = '<div class="pan-wrap">';
  html += '<svg class="zihua-svg" id="zihuaSvg" preserveAspectRatio="none"></svg>';
  html += '<div class="pan-grid" id="panGrid">';
  for (var r=0; r<4; r++) {
    for (var c=0; c<4; c++) {
      if (r>=1 && r<=2 && c>=1 && c<=2) {
        if (r===1 && c===1) html += '<div class="cell-center">' + centerHtml + '</div>';
        continue;
      }
      var foundDz = null;
      for (var key in gridPos) {
        if (gridPos[key][0]===r && gridPos[key][1]===c) { foundDz = key; break; }
      }
      if (foundDz) {
        var activeCls = (foundDz===CURRENT_FEIHUA_GONG) ? " active-gong" : "";
        html += '<div class="cell' + activeCls + '" id="cell-' + foundDz + '" onclick="clickGong(\'' + foundDz + '\')">' + (cellContents[foundDz]||"空") + '</div>';
      } else {
        html += '<div class="cell"></div>';
      }
    }
  }
  html += '</div></div>';

  var legendHtml = '<span>点击宫位查看飞化：</span>';
  if (isSix()) {
    legendHtml += '<span class="ke">科</span><span class="kui">魁</span><span class="lu">禄</span><span class="quan">权</span><span class="fu">福</span><span class="huo">祸</span>';
  } else {
    legendHtml += '<span class="lu">禄</span><span class="quan">权</span><span class="ke">科</span><span class="ji">忌</span>';
  }
  legendHtml += '<span style="margin-left:15px;color:#666;font-weight:normal;">点击流年框切换年命；紫字=小限；红框=来因</span>';
  legendHtml += (CURRENT_LIUNIAN_AGE !== null ? '　<b>流年：' + CURRENT_LIUNIAN_AGE + '岁，小限在' + getXiaoXianGong(CURRENT_LIUNIAN_AGE) + '宫，年命在' + getLiuNianGong(CURRENT_LIUNIAN_AGE) + '宫</b>' : '');
  legendHtml += (CURRENT_FEIHUA_GONG ? '　<b>飞化：' + CURRENT_FEIHUA_GONG + '宫</b>' : '');
  html += '<div class="feihua-legend">' + legendHtml + '</div>';

  html += buildTimeline();
  document.getElementById("result").innerHTML = html;
  setTimeout(function() {
    drawArrows();
    positionZihuaTags();
  }, 50);
}

function positionZihuaTags() {
  var allDz = GROUP_BOTTOM.concat(GROUP_TOP);
  for (var i=0; i<allDz.length; i++) {
    var dz = allDz[i];
    var cell = document.getElementById("cell-" + dz);
    if (!cell) continue;
    var row = cell.querySelector(".zihua-tag-row");
    if (!row) continue;
    var cellRect = cell.getBoundingClientRect();
    var tags = row.querySelectorAll(".sihua");
    if (tags.length === 0) continue;
    var usedX = {};
    for (var j=0; j<tags.length; j++) {
      var tag = tags[j];
      var starName = tag.getAttribute("data-zstar");
      if (!starName) continue;
      var starEl = cell.querySelector('.star-group[data-star="' + starName + '"]');
      if (!starEl) continue;
      var sr = starEl.getBoundingClientRect();
      var cx = sr.left - cellRect.left + sr.width / 2;
      var leftPx = Math.round(cx + 3);
      while (usedX[leftPx]) leftPx += 20;
      usedX[leftPx] = true;
      tag.style.left = leftPx + "px";
    }
  }
}

function clickGong(dz) {
  if (CURRENT_FEIHUA_GONG === dz) CURRENT_FEIHUA_GONG = null;
  else CURRENT_FEIHUA_GONG = dz;
  renderPan();
}
function clickLiuNian(age) {
  if (CURRENT_LIUNIAN_AGE === age) CURRENT_LIUNIAN_AGE = null;
  else CURRENT_LIUNIAN_AGE = age;
  renderPan();
}
function switchDaXian(i) { CURRENT_DAXIAN_INDEX = i; CURRENT_LIUNIAN_AGE = null; renderPan(); }
function switchPanType(t) {
  PAN_TYPE = t;
  document.getElementById("btn-zhtj").classList.toggle("active", t==="zhongtian");
  document.getElementById("btn-zhtj6").classList.toggle("active", t==="zhongtian6");
  document.getElementById("btn-ziwei").classList.toggle("active", t==="ziwei");
  paipan();
}

function getAnchorPoint(dz) {
  var cell = document.getElementById("cell-" + dz);
  var panGrid = document.getElementById("panGrid");
  if (!cell || !panGrid) return null;
  var r = cell.getBoundingClientRect();
  var gridR = panGrid.getBoundingClientRect();
  var left = r.left - gridR.left, top = r.top - gridR.top;
  return {left:left, top:top, right:left+r.width, bottom:top+r.height, cx:left+r.width/2, cy:top+r.height/2};
}
function getLinePoints(dz, targetDz) {
  var a = getAnchorPoint(dz), b = getAnchorPoint(targetDz);
  if (!a || !b) return null;
  var dx = b.cx - a.cx, dy = b.cy - a.cy;
  if (CORNER_PAIRS[dz]) {
    return {x1:(dx>0?a.right:a.left), y1:(dy>0?a.bottom:a.top), x2:(dx>0?b.left:b.right), y2:(dy>0?b.top:b.bottom)};
  } else {
    if (Math.abs(dy) > Math.abs(dx)) return {x1:a.cx, y1:(dy>0?a.bottom:a.top), x2:b.cx, y2:(dy>0?b.top:b.bottom)};
    return {x1:(dx>0?a.right:a.left), y1:a.cy, x2:(dx>0?b.left:b.right), y2:b.cy};
  }
}

function drawArrows() {
  var svg = document.getElementById("zihuaSvg");
  var panGrid = document.getElementById("panGrid");
  if (!svg || !panGrid) return;
  
  var w = panGrid.offsetWidth;
  var h = panGrid.offsetHeight;
  
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.style.width = w + "px"; 
  svg.style.height = h + "px";
  
  var isMob = document.body.classList.contains("mobile-mode");
  var outDist = isMob ? 20 : 38;
  var strokeW = isMob ? 1.5 : 2;
  
var svgHtml = '<defs>' +
  '<marker id="zh-arrow-lu" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#28a745"/></marker>' +
  '<marker id="zh-arrow-quan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#8e44ad"/></marker>' +
  '<marker id="zh-arrow-ke" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#007bff"/></marker>' +
  '<marker id="zh-arrow-ji" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#dc3545"/></marker>' +
  '<marker id="zh-arrow-kui" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#17a2b8"/></marker>' +
  '<marker id="zh-arrow-fu" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#ff9800"/></marker>' +
  '<marker id="zh-arrow-huo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 L2,4 z" fill="#dc3545"/></marker>' +
  '</defs>';

  var zihuaMap = getZiHuaMap();
  for (var dz in zihuaMap) {
    var cell = document.getElementById("cell-" + dz);
    if (!cell) continue;
    var thisGongGan = PAN_DATA.gongGan[dz];
    var inCellLabel = isZihuaLabelInCell(dz);
    for (var star in zihuaMap[dz]) {
      var types = zihuaMap[dz][star];
      var starGroup = cell.querySelector('.star-group[data-star="' + star + '"]');
      if (!starGroup) continue;
      
      var sx = cell.offsetLeft + starGroup.offsetLeft + starGroup.offsetWidth / 2;
      var syTop = cell.offsetTop + starGroup.offsetTop;
      var syBottom = syTop + starGroup.offsetHeight;
      
      for (var ti=0; ti<types.length; ti++) {
        var type = types[ti];
        var label = getSihuaLabelWithContext(thisGongGan, star, type);
        var color = SIHUA_COLOR[type];
        var marker = "zh-arrow-" + SIHUA_CLS[type];
        var path = "", labelX = 0, labelY = 0;
        var offsetY = ti * (isMob ? 12 : 16);
        if (GROUP_BOTTOM.indexOf(dz)>=0) {
          var syB2 = syBottom + offsetY;
          path = "M" + sx + " " + syB2 + " L" + sx + " " + (h+outDist+offsetY);
          labelX = sx + 6;
          labelY = h + 12 + offsetY;
        } else if (GROUP_LEFT.indexOf(dz)>=0) {
          var ey = syBottom + 20 + offsetY;
          path = "M" + sx + " " + (syBottom + offsetY) + " L" + sx + " " + ey + " L" + (-outDist) + " " + ey;
          labelX = sx + 5; labelY = syBottom + 12 + offsetY;
        } else if (GROUP_RIGHT.indexOf(dz)>=0) {
          var ey = syBottom + 20 + offsetY;
          path = "M" + sx + " " + (syBottom + offsetY) + " L" + sx + " " + ey + " L" + (w+outDist) + " " + ey;
          labelX = sx + 5; labelY = syBottom + 12 + offsetY;
        } else if (GROUP_TOP.indexOf(dz)>=0) {
          var syT2 = syTop - offsetY;
          path = "M" + sx + " " + syT2 + " L" + sx + " " + (-outDist - offsetY);
          labelX = sx + 5; labelY = syT2 - 3;
        }
        if (path) {
          svgHtml += '<path d="' + path + '" stroke="' + color + '" stroke-width="' + strokeW + '" fill="none" marker-end="url(#' + marker + ')"/>';
          if (!inCellLabel) {
            svgHtml += '<text x="' + labelX + '" y="' + labelY + '" fill="' + color + '" font-size="' + (isMob?12:13) + '" font-weight="bold" font-family="Microsoft YaHei, Arial">' + label + '</text>';
          }
        }
      }
    }
  }

  /* 对宫飞化 */
  for (var i=0; i<DIZHI.length; i++) {
    var dz2 = DIZHI[i];
    var duiDz = DUI_GONG[dz2];
    if (!duiDz) continue;
    var gGan = PAN_DATA.gongGan[dz2];
    if (!gGan) continue;
    var sh = getActiveGongSihuaTable()[gGan];
    if (!sh) continue;
    var matched = [];
    for (var type2 in sh) {
      var targets = toArr(sh[type2]);
      for (var ti2=0; ti2<targets.length; ti2++) {
        if (PAN_DATA.palaces[duiDz].indexOf(targets[ti2]) >= 0) {
          matched.push({type: type2, star: targets[ti2]});
        }
      }
    }
    if (matched.length === 0) continue;
    var pts = getLinePoints(dz2, duiDz);
    if (!pts) continue;
    var dx = pts.x2 - pts.x1, dy = pts.y2 - pts.y1;
    var len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) continue;
    var rx = -dy/len, ry = dx/len;
    var t = 0.92;
    var offsetStep = isMob ? 10 : 14;
    for (var k=0; k<matched.length; k++) {
      var type3 = matched[k].type;
      var star3 = matched[k].star;
      var label3 = getSihuaLabelWithContext(gGan, star3, type3);
      var normalOffset = (k - (matched.length-1)/2) * offsetStep;
      var bx = pts.x1 + rx * normalOffset;
      var by = pts.y1 + ry * normalOffset;
      var ex3 = pts.x2 + rx * normalOffset;
      var ey3 = pts.y2 + ry * normalOffset;
      var px = bx + (ex3 - bx) * t;
      var py = by + (ey3 - by) * t;
      var lx = px + rx * offsetStep;
      var ly = py + ry * offsetStep;
      var color2 = SIHUA_COLOR[type3];
      var marker2 = "zh-arrow-" + SIHUA_CLS[type3];
      svgHtml += '<line x1="' + bx + '" y1="' + by + '" x2="' + ex3 + '" y2="' + ey3 + '" stroke="' + color2 + '" stroke-width="' + strokeW + '" marker-end="url(#' + marker2 + ')" opacity="0.85"/>';
      svgHtml += '<text x="' + lx + '" y="' + ly + '" fill="' + color2 + '" font-size="' + (isMob?12:13) + '" font-weight="bold" font-family="Microsoft YaHei, Arial">' + label3 + '</text>';
    }
  }
  svg.innerHTML = svgHtml;
}

var DB_NAME = "zwds_db", DB_VERSION = 1, STORE_CASES = "cases";
var _db = null, CASES_CACHE = [], CURRENT_CASE_ID = null;

var GROUPS_KEY = "zwds_groups_v1";
var GROUP_COUNT = 20;
var GROUPS = (function() {
  try {
    var g = JSON.parse(localStorage.getItem(GROUPS_KEY) || "null");
    if (Array.isArray(g) && g.length === GROUP_COUNT) return g;
  } catch(e) {}
  var arr = [];
  for (var i=0; i<GROUP_COUNT; i++) arr.push("分组" + (i+1));
  return arr;
})();
var CURRENT_GROUP_FILTER = -1;
var CURRENT_SEARCH = "";

function saveGroups() {
  localStorage.setItem(GROUPS_KEY, JSON.stringify(GROUPS));
}
function initGroupSelect() {
  var sel = document.getElementById("caseGroupSelect");
  if (!sel) return;
  var html = "";
  for (var i=0; i<GROUP_COUNT; i++) {
    html += '<option value="' + i + '">' + escHtml(GROUPS[i]) + '</option>';
  }
  sel.innerHTML = html;
}
function renderGroupTabs() {
  var el = document.getElementById("groupTabs");
  if (!el) return;
  var counts = {};
  for (var i=0; i<GROUP_COUNT; i++) counts[i] = 0;
  var total = 0;
  for (var k=0; k<CASES_CACHE.length; k++) {
    var c = CASES_CACHE[k];
    var g = (typeof c.group === "number" && c.group >= 0 && c.group < GROUP_COUNT) ? c.group : 0;
    counts[g]++;
    total++;
  }
  var html = '<div class="group-tab' + (CURRENT_GROUP_FILTER === -1 ? ' active' : '') + '" onclick="setGroupFilter(-1)">全部<span class="count">' + total + '</span></div>';
  for (var i=0; i<GROUP_COUNT; i++) {
    var cls = (CURRENT_GROUP_FILTER === i) ? ' active' : '';
    html += '<div class="group-tab' + cls + '" onclick="setGroupFilter(' + i + ')">' + escHtml(GROUPS[i]) + '<span class="count">' + counts[i] + '</span></div>';
  }

}
function setGroupFilter(i) {
  CURRENT_GROUP_FILTER = i;
  renderGroupTabs();
  renderCaseList();
}
function renderGroupMgr() {
  var el = document.getElementById("groupMgrGrid");
  if (!el) return;

    html += '<div class="row"><label>' + (i+1) + '：</label><input type="text" value="' + escHtml(GROUPS[i]) + '" onchange="renameGroup(' + i + ', this.value)"></div>';
  }

function renameGroup(idx, val) {

  if (!name) name = "分组" + (idx+1);

  saveGroups();
  renderGroupTabs();

function toggleGroupMgr() {

function onSearchInput(val) {
  CURRENT_SEARCH = (val || "").trim();
  renderCaseList();
}
function clearSearch() {
  document.getElementById("caseSearchInput").value = "";
  CURRENT_SEARCH = "";
  renderCaseList();
}
function highlightKeyword(text, kw) {
  if (!kw) return escHtml(text);
  var escaped = escHtml(text);
  var re = new RegExp("(" + kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return escaped.replace(re, '<span class="search-hit">$1</span>');
}

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_CASES)) db.createObjectStore(STORE_CASES, {keyPath:"id"});
    };
    req.onsuccess = function(e) { _db = e.target.result; resolve(_db); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}
function dbGetAllCases() {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var req = db.transaction(STORE_CASES, "readonly").objectStore(STORE_CASES).getAll();
      req.onsuccess = function() {
        var list = req.result || [];
        list.sort(function(a,b){ return (b.updated_at||0)-(a.updated_at||0); });
        resolve(list);
      };
      req.onerror = function() { reject(req.error); };
    });
  });
}
function dbPutCase(item) {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE_CASES, "readwrite");
      tx.objectStore(STORE_CASES).put(item);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}
function dbDeleteCase(id) {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE_CASES, "readwrite");
      tx.objectStore(STORE_CASES).delete(id);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}
function dbPutAllCases(list) {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE_CASES, "readwrite");
      var store = tx.objectStore(STORE_CASES);
      store.clear();
      list.forEach(function(c) { store.put(c); });
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}
function loadCases() { return CASES_CACHE; }
function refreshCache() { return dbGetAllCases().then(function(list) { CASES_CACHE = list; return list; }); }
function migrateFromLocalStorage() {
  var raw = localStorage.getItem("zwds_cases_v1");
  if (!raw) return Promise.resolve(0);
  var old; try { old = JSON.parse(raw); } catch(e) { return Promise.resolve(0); }
  if (!Array.isArray(old) || old.length === 0) return Promise.resolve(0);
  return dbGetAllCases().then(function(current) {
    var existing = {};
    current.forEach(function(c) { existing[c.id] = true; });
    var toAdd = old.filter(function(c) { return c.id && !existing[c.id]; });
    if (toAdd.length === 0) return 0;
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction(STORE_CASES, "readwrite");
        var store = tx.objectStore(STORE_CASES);
        toAdd.forEach(function(c) { if (typeof c.group !== "number") c.group = 0; store.put(c); });
        tx.oncomplete = function() { resolve(toAdd.length); };
        tx.onerror = function() { reject(tx.error); };
      });
    });
  });
}

var GIST_KEY = "zwds_gist_v1";
var GIST_CONFIG = (function() {
  try {
    var c = JSON.parse(localStorage.getItem(GIST_KEY) || "{}");
    return {enabled:!!c.enabled, token:c.token||"", gistId:c.gistId||"", filename:c.filename||"zwds_cases.json", autoSync:c.autoSync!==false};
  } catch(e) { return {enabled:false, token:"", gistId:"", filename:"zwds_cases.json", autoSync:true}; }
})();
function saveGistConfigToStorage() { localStorage.setItem(GIST_KEY, JSON.stringify(GIST_CONFIG)); }
async function gistPush() {
  if (!GIST_CONFIG.token) throw new Error("未配置 token");
  var list = await dbGetAllCases();
  var content = JSON.stringify({version:1, app:"zwds", exported_at:Date.now(), groups:GROUPS, cases:list}, null, 2);
  var body = {description:"中天太极紫微数案例备份（自动生成）", files:{}};
  body.files[GIST_CONFIG.filename] = {content:content};
  var url, method;
  if (GIST_CONFIG.gistId) { url = "https://api.github.com/gists/" + GIST_CONFIG.gistId; method = "PATCH"; }
  else { url = "https://api.github.com/gists"; method = "POST"; body.public = false; }
  var res = await fetch(url, {
    method: method,
    headers: {"Authorization":"Bearer " + GIST_CONFIG.token, "Accept":"application/vnd.github+json", "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  if (!GIST_CONFIG.gistId) { GIST_CONFIG.gistId = data.id; saveGistConfigToStorage(); }
  return data;
}
async function gistPull() {
  if (!GIST_CONFIG.token || !GIST_CONFIG.gistId) throw new Error("未配置 token 或 Gist ID");
  var res = await fetch("https://api.github.com/gists/" + GIST_CONFIG.gistId, {
    headers: {"Authorization":"Bearer " + GIST_CONFIG.token, "Accept":"application/vnd.github+json"}
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  var f = data.files[GIST_CONFIG.filename];
  if (!f) throw new Error("备份文件不存在");
  var content = f.content;
  if (f.truncated && f.raw_url) {
    var raw = await fetch(f.raw_url, {headers:{"Authorization":"Bearer " + GIST_CONFIG.token}});
    content = await raw.text();
  }
  var parsed = JSON.parse(content);
  return {
    cases: Array.isArray(parsed) ? parsed : (parsed.cases || []),
    groups: (!Array.isArray(parsed) && parsed.groups) ? parsed.groups : null
  };
}
function gistAutoSync() {
  if (!GIST_CONFIG.enabled || !GIST_CONFIG.token || !GIST_CONFIG.autoSync) return;
  gistPush().catch(function(e) { console.warn("Gist 同步失败", e); });
}

/* ===== 工具 ===== */
function genId() { return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }
function pad2(n) { return (n<10?"0":"") + n; }
function escHtml(s) {
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function getCaseById(id) { for (var i=0; i<CASES_CACHE.length; i++) if (CASES_CACHE[i].id === id) return CASES_CACHE[i]; return null; }
function collectInputs() {
  return {
    calendar_type: document.getElementById("calendarType").value,
    year: parseInt(document.getElementById("inputYear").value),
    month: parseInt(document.getElementById("inputMonth").value),
    day: parseInt(document.getElementById("inputDay").value),
    hour: parseInt(document.getElementById("inputHour").value),
    minute: parseInt(document.getElementById("inputMinute").value) || 0,
    gender: document.getElementById("gender").value
  };
}
function autoName(c) {
  return (c.calendar_type==="solar"?"公":"农") + c.year + "-" + pad2(c.month) + "-" + pad2(c.day) + " " + pad2(c.hour) + ":" + pad2(c.minute) + " " + c.gender;
}

function saveCase() {
  var inputs = collectInputs();
  if (isNaN(inputs.year)||isNaN(inputs.month)||isNaN(inputs.day)||isNaN(inputs.hour)) { alert("请先填写完整的出生信息"); return; }
  var name = document.getElementById("caseName").value.trim() || autoName(inputs);
  var note = document.getElementById("caseNote").value;
  var gsel = document.getElementById("caseGroupSelect");
  var grp = gsel ? parseInt(gsel.value) : 0;
  if (isNaN(grp) || grp < 0 || grp >= GROUP_COUNT) grp = 0;
  var item = Object.assign({}, inputs, {id:genId(), name:name, note:note, group:grp, created_at:Date.now(), updated_at:Date.now()});
  CASES_CACHE.unshift(item);
  CASES_CACHE.sort(function(a,b){ return (b.updated_at||0)-(a.updated_at||0); });
  dbPutCase(item).then(function() { refreshCache().then(function(){ renderCaseList(); renderGroupTabs(); }); });
  CURRENT_CASE_ID = item.id;
  document.getElementById("caseName").value = name;
  document.getElementById("btnUpdate").style.display = "inline-block";
  renderCaseList(); renderGroupTabs(); updateCaseCount(); gistAutoSync();
}
function updateCurrentCase() {
  if (!CURRENT_CASE_ID) { alert("当前没有关联案例，请先「保存案例」"); return; }
  var old = getCaseById(CURRENT_CASE_ID);
  if (!old) { alert("找不到当前案例"); CURRENT_CASE_ID = null; document.getElementById("btnUpdate").style.display = "none"; return; }
  var inputs = collectInputs();
  var gsel = document.getElementById("caseGroupSelect");
  var grp = gsel ? parseInt(gsel.value) : old.group;
  if (isNaN(grp) || grp < 0 || grp >= GROUP_COUNT) grp = old.group || 0;
  var updated = Object.assign({}, old, inputs, {
    name: document.getElementById("caseName").value.trim() || old.name || autoName(inputs),
    note: document.getElementById("caseNote").value,
    group: grp,
    updated_at: Date.now()
  });
  for (var i=0; i<CASES_CACHE.length; i++) if (CASES_CACHE[i].id === updated.id) { CASES_CACHE[i] = updated; break; }
  CASES_CACHE.sort(function(a,b){ return (b.updated_at||0)-(a.updated_at||0); });
  dbPutCase(updated).then(function() { refreshCache().then(function(){ renderCaseList(); renderGroupTabs(); }); });
  document.getElementById("caseName").value = updated.name;
  renderCaseList(); renderGroupTabs(); gistAutoSync();
}
function deleteCase(id) {
  var c = getCaseById(id); if (!c) return;
  if (!confirm("确定删除案例「" + (c.name||"未命名") + "」吗？")) return;
  dbDeleteCase(id).then(function() { return refreshCache(); }).then(function() {
    if (CURRENT_CASE_ID === id) { CURRENT_CASE_ID = null; document.getElementById("btnUpdate").style.display = "none"; }
    renderCaseList(); renderGroupTabs(); updateCaseCount(); gistAutoSync();
  });
}
function newCase() {
  CURRENT_CASE_ID = null;
  document.getElementById("caseName").value = "";
  document.getElementById("caseNote").value = "";
  document.getElementById("btnUpdate").style.display = "none";
  renderCaseList();
}
function moveCaseToGroup(id, newGroup) {
  var c = getCaseById(id); if (!c) return;
  c.group = newGroup;
  c.updated_at = Date.now();
  dbPutCase(c).then(function() { refreshCache().then(function(){ renderCaseList(); renderGroupTabs(); }); });
  renderGroupTabs();
  gistAutoSync();
}
function loadCase(id) {
  var c = getCaseById(id); if (!c) return;
  document.getElementById("calendarType").value = c.calendar_type;
  document.getElementById("inputYear").value = c.year;
  document.getElementById("inputMonth").value = c.month;
  document.getElementById("inputDay").value = c.day;
  document.getElementById("inputHour").value = c.hour;
  document.getElementById("inputMinute").value = c.minute;
  document.getElementById("gender").value = c.gender;
  document.getElementById("caseName").value = c.name || "";
  document.getElementById("caseNote").value = c.note || "";
  var gsel = document.getElementById("caseGroupSelect");
  if (gsel && typeof c.group === "number") gsel.value = String(c.group);
  CURRENT_CASE_ID = c.id;
  document.getElementById("btnUpdate").style.display = "inline-block";
  renderCaseList(); paipan();
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderCaseList() {
  var listEl = document.getElementById("caseList"); if (!listEl) return;
  var list = loadCases();

  var filtered = list.filter(function(c) {
    var g = (typeof c.group === "number" && c.group >= 0 && c.group < GROUP_COUNT) ? c.group : 0;
    if (CURRENT_GROUP_FILTER >= 0 && g !== CURRENT_GROUP_FILTER) return false;
    if (CURRENT_SEARCH) {
      var q = CURRENT_SEARCH.toLowerCase();
      var text = ((c.name || "") + " " + (c.note || "") + " " +
                  c.year + "-" + pad2(c.month) + "-" + pad2(c.day) + " " +
                  c.hour + ":" + pad2(c.minute) + " " + c.gender).toLowerCase();
      if (text.indexOf(q) < 0) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    var msg = "暂无案例。填好信息后点「保存案例」即可。";
    if (CURRENT_SEARCH) msg = "没有匹配「" + escHtml(CURRENT_SEARCH) + "」的案例。";
    else if (CURRENT_GROUP_FILTER >= 0) msg = "该分组下暂无案例。";
    listEl.innerHTML = '<div class="case-empty">' + msg + '</div>';
    return;
  }

  var html = "";
  for (var i=0; i<filtered.length; i++) {
    var c = filtered[i];
    var activeCls = (c.id === CURRENT_CASE_ID) ? " active" : "";
    var dt = new Date(c.updated_at || c.created_at || Date.now());
    var timeStr = dt.getFullYear() + "-" + pad2(dt.getMonth()+1) + "-" + pad2(dt.getDate()) + " " + pad2(dt.getHours()) + ":" + pad2(dt.getMinutes());
    var gz = (c.calendar_type==="solar"?"公历":"农历") + " " + c.year + "-" + pad2(c.month) + "-" + pad2(c.day) + " " + pad2(c.hour) + ":" + pad2(c.minute) + " " + c.gender;
    var gIdx = (typeof c.group === "number" && c.group >= 0 && c.group < GROUP_COUNT) ? c.group : 0;
    var noteHtml = c.note ? '<div class="case-note">' + highlightKeyword(c.note, CURRENT_SEARCH) + '</div>' : "";
    var cloudBadge = (GIST_CONFIG.enabled && GIST_CONFIG.gistId) ? '<span class="cloud-badge">☁Gist</span>' : '';
    var grpBadge = '<span class="grp-badge">' + escHtml(GROUPS[gIdx]) + '</span>';

    var grpOptions = "";
    for (var gi=0; gi<GROUP_COUNT; gi++) {
      grpOptions += '<option value="' + gi + '"' + (gi===gIdx ? ' selected' : '') + '>' + escHtml(GROUPS[gi]) + '</option>';
    }

    html += '<div class="case-item' + activeCls + '">' +
              '<div class="case-info">' +
                '<div class="case-title">' + highlightKeyword(c.name||"未命名", CURRENT_SEARCH) + grpBadge + cloudBadge + '</div>' +
                '<div class="case-meta">' + gz + '　·　' + timeStr + '</div>' +
                noteHtml +
              '</div>' +
              '<div class="case-actions">' +
                '<button class="btn-success" onclick="loadCase(\'' + c.id + '\')">载入</button>' +
                '<select onchange="moveCaseToGroup(\'' + c.id + '\', parseInt(this.value))" title="移动到分组">' + grpOptions + '</select>' +
                '<button class="btn-danger" onclick="deleteCase(\'' + c.id + '\')">删除</button>' +
              '</div></div>';
  }
  listEl.innerHTML = html;
}
function updateCaseCount() {
  var n = CASES_CACHE.length;
  var a = document.getElementById("caseCount"), b = document.getElementById("caseCount2");
  if (a) a.textContent = n;
  if (b) b.textContent = n;
}
function toggleCaseList() {
  var p = document.getElementById("casePanel");
  var isHidden = p.style.display === "none";
  p.style.display = isHidden ? "block" : "none";
  if (isHidden) { renderCaseList(); renderGroupTabs(); }
}

function toggleGistConfig() {
  var p = document.getElementById("gistConfigPanel");
  p.style.display = (p.style.display === "none") ? "block" : "none";
  if (p.style.display === "block") syncGistConfigUI();
}
function syncGistConfigUI() {
  document.getElementById("gistEnabled").checked = GIST_CONFIG.enabled;
  document.getElementById("gistAutoSync").checked = GIST_CONFIG.autoSync !== false;
  document.getElementById("gistToken").value = GIST_CONFIG.token || "";
  document.getElementById("gistId").value = GIST_CONFIG.gistId || "";
  document.getElementById("gistFilename").value = GIST_CONFIG.filename || "zwds_cases.json";
  var st = document.getElementById("gistStatus");
  if (GIST_CONFIG.gistId) {
    st.innerHTML = '✅ 已关联 Gist：<a href="https://gist.github.com/' + GIST_CONFIG.gistId + '" target="_blank" style="color:#4a90d9;">' + GIST_CONFIG.gistId + '</a>';
  } else { st.textContent = "尚未创建 Gist"; }
}
function saveGistConfigUI() {
  var enabled = document.getElementById("gistEnabled").checked;
  var token = document.getElementById("gistToken").value.trim();
  var gistId = document.getElementById("gistId").value.trim();
  var filename = document.getElementById("gistFilename").value.trim() || "zwds_cases.json";
  var autoSync = document.getElementById("gistAutoSync").checked;
  if (enabled && !token) { alert("启用 Gist 需要填写 Token"); return; }
  GIST_CONFIG = {enabled:enabled, token:token, gistId:gistId, filename:filename, autoSync:autoSync};
  saveGistConfigToStorage();
  syncGistConfigUI(); renderCaseList();
  alert("Gist 配置已保存");
  if (enabled && !gistId) { if (confirm("还没有关联 Gist。现在创建一个新的私有 Gist 来保存案例吗？")) gistBackupNow(); }
}
async function gistBackupNow() {
  if (!GIST_CONFIG.token) { alert("请先填写 Token 并保存"); return; }
  try {
    var data = await gistPush();
    alert("✅ 已上传到 Gist：" + data.html_url);
    syncGistConfigUI(); renderCaseList();
  } catch(e) { alert("❌ 上传失败：" + e.message); }
}
async function gistRestoreNow() {
  if (!GIST_CONFIG.token || !GIST_CONFIG.gistId) { alert("请先填写 Token 和 Gist ID"); return; }
  if (!confirm("从 Gist 拉取数据并合并到本地？\n同 ID 的案例会被 Gist 版本覆盖。")) return;
  try {
    var result = await gistPull();
    var list = result.cases;
    if (!Array.isArray(list)) throw new Error("数据格式异常");
    if (result.groups && Array.isArray(result.groups) && result.groups.length === GROUP_COUNT) {
      if (confirm("云端有分组名称配置，是否用云端的覆盖本地分组名称？")) {
        GROUPS = result.groups;
        saveGroups();
        renderGroupMgr(); renderGroupTabs(); initGroupSelect();
      }
    }
    var map = {};
    for (var i=0; i<CASES_CACHE.length; i++) map[CASES_CACHE[i].id] = CASES_CACHE[i];
    var added = 0, updated = 0;
    for (var j=0; j<list.length; j++) {
      var c = list[j];
      if (!c.id) c.id = genId();
      if (typeof c.group !== "number") c.group = 0;
      if (map[c.id]) updated++; else added++;
      map[c.id] = c;
    }
    CASES_CACHE = Object.keys(map).map(function(k){ return map[k]; });
    CASES_CACHE.sort(function(a,b){ return (b.updated_at||0)-(a.updated_at||0); });
    await dbPutAllCases(CASES_CACHE);
    await refreshCache();
    renderCaseList(); renderGroupTabs(); updateCaseCount();
    alert("恢复完成：新增 " + added + "，更新 " + updated);
  } catch(e) { alert("❌ 恢复失败：" + e.message); }
}
async function gistTest() {
  var token = document.getElementById("gistToken").value.trim();
  if (!token) { alert("请先填写 Token"); return; }
  try {
    var res = await fetch("https://api.github.com/user", {headers:{"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json"}});
    if (res.ok) { var u = await res.json(); alert("✅ 连接成功！用户：" + u.login); }
    else alert("❌ 失败，HTTP " + res.status);
  } catch(e) { alert("❌ 网络错误：" + e.message); }
}

function exportCases() {
  var list = loadCases();
  if (list.length === 0) { alert("没有案例可导出"); return; }
  var data = JSON.stringify({version:1, app:"zwds", exported_at:Date.now(), groups:GROUPS, cases:list}, null, 2);
  var blob = new Blob([data], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  var d = new Date();
  a.download = "紫微案例_" + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
function importCases(ev) {
  var file = ev.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      var incoming = Array.isArray(parsed) ? parsed : (parsed.cases || []);
      if (!Array.isArray(incoming)) throw new Error("文件格式错误");
      if (!Array.isArray(parsed) && parsed.groups && Array.isArray(parsed.groups) && parsed.groups.length === GROUP_COUNT) {
        if (confirm("文件包含分组名称配置，是否用文件里的覆盖本地分组名称？")) {
          GROUPS = parsed.groups;
          saveGroups();
          renderGroupMgr(); renderGroupTabs(); initGroupSelect();
        }
      }
      var map = {};
      for (var k=0; k<CASES_CACHE.length; k++) map[CASES_CACHE[k].id] = CASES_CACHE[k];
      var added = 0, updated = 0;
      for (var j=0; j<incoming.length; j++) {
        var c = incoming[j];
        if (!c.id) c.id = genId();
        if (typeof c.group !== "number") c.group = 0;
        if (map[c.id]) updated++; else added++;
        map[c.id] = c;
      }
      CASES_CACHE = Object.keys(map).map(function(k2){ return map[k2]; });
      CASES_CACHE.sort(function(a,b){ return (b.updated_at||0)-(a.updated_at||0); });
      dbPutAllCases(CASES_CACHE).then(function() { return refreshCache(); }).then(function() {
        renderCaseList(); renderGroupTabs(); updateCaseCount(); gistAutoSync();
      });
      alert("导入完成：新增 " + added + " 条，更新 " + updated + " 条");
    } catch(err) { alert("导入失败：" + err.message); }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

window.addEventListener("DOMContentLoaded", function() {
  syncGistConfigUI();
  initGroupSelect();
  migrateFromLocalStorage().then(function() { return refreshCache(); }).then(function() {
    renderCaseList(); renderGroupTabs(); updateCaseCount();
  }).catch(function(e) {
    console.error("初始化失败", e);
    renderCaseList(); renderGroupTabs(); updateCaseCount();
  });
});
</script>
